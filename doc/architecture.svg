<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- FPGA boundary -->
  <rect x="150" y="20" width="570" height="360" rx="10" fill="#f7f9fc" stroke="#9aa7b8" stroke-dasharray="6 4"/>
  <text x="165" y="42" font-weight="bold" fill="#5b6778">DE1-SoC board: everything inside runs on the Cyclone V FPGA</text>

  <!-- External devices -->
  <rect x="15" y="80" width="110" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="70" y="102" text-anchor="middle" font-weight="bold">Camera</text>
  <text x="70" y="119" text-anchor="middle" font-size="11">video in</text>

  <rect x="15" y="250" width="110" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="70" y="272" text-anchor="middle" font-weight="bold">PS/2 keyboard</text>
  <text x="70" y="289" text-anchor="middle" font-size="11">filter / snapshot keys</text>

  <rect x="755" y="155" width="110" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="810" y="177" text-anchor="middle" font-weight="bold">VGA monitor</text>
  <text x="810" y="194" text-anchor="middle" font-size="11">320×240 RGB565</text>

  <!-- Video in path -->
  <rect x="180" y="65" width="150" height="80" rx="6" fill="#e8f0fb" stroke="#4a78b5"/>
  <text x="255" y="88" text-anchor="middle" font-weight="bold">Video-in DMA</text>
  <text x="255" y="106" text-anchor="middle" font-size="11">+ hardware edge</text>
  <text x="255" y="121" text-anchor="middle" font-size="11">detect (SW0 toggle)</text>
  <text x="255" y="136" text-anchor="middle" font-size="11" fill="#5b6778">0xFF203060 / 70</text>

  <rect x="360" y="65" width="140" height="80" rx="6" fill="#fff" stroke="#4a78b5"/>
  <text x="430" y="92" text-anchor="middle" font-weight="bold">Video buffer</text>
  <text x="430" y="110" text-anchor="middle" font-size="11">320×240, 512-px stride</text>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#5b6778">0x08000000</text>

  <!-- CPU -->
  <rect x="300" y="185" width="260" height="110" rx="6" fill="#fdf1e3" stroke="#c07a26"/>
  <text x="430" y="207" text-anchor="middle" font-weight="bold">RISC-V soft core (Nios V) in the FPGA</text>
  <text x="430" y="226" text-anchor="middle" font-size="11">bare-metal C main loop, no OS</text>
  <text x="430" y="246" text-anchor="middle" font-size="11">1. poll PS/2 FIFO for a make code</text>
  <text x="430" y="263" text-anchor="middle" font-size="11">2. run the selected per-pixel filter</text>
  <text x="430" y="280" text-anchor="middle" font-size="11">3. swap VGA buffers on v-sync</text>

  <!-- SDRAM snapshot -->
  <rect x="180" y="315" width="150" height="50" rx="6" fill="#fff" stroke="#c07a26"/>
  <text x="255" y="337" text-anchor="middle" font-weight="bold">SDRAM snapshot</text>
  <text x="255" y="354" text-anchor="middle" font-size="11" fill="#5b6778">0x01000000</text>

  <!-- VGA double buffer -->
  <rect x="590" y="100" width="110" height="55" rx="6" fill="#eaf6ec" stroke="#3d8b4f"/>
  <text x="645" y="123" text-anchor="middle" font-weight="bold">Back buffer</text>
  <text x="645" y="141" text-anchor="middle" font-size="11">CPU draws here</text>

  <rect x="590" y="205" width="110" height="55" rx="6" fill="#eaf6ec" stroke="#3d8b4f"/>
  <text x="645" y="228" text-anchor="middle" font-weight="bold">Front buffer</text>
  <text x="645" y="246" text-anchor="middle" font-size="11">scanned to VGA</text>

  <rect x="590" y="285" width="110" height="40" rx="6" fill="#fff" stroke="#3d8b4f"/>
  <text x="645" y="303" text-anchor="middle" font-size="11">Pixel buffer ctrl</text>
  <text x="645" y="318" text-anchor="middle" font-size="11" fill="#5b6778">0xFF203020</text>

  <!-- Arrows -->
  <line x1="125" y1="105" x2="178" y2="105" stroke="#333" marker-end="url(#a)"/>
  <line x1="330" y1="105" x2="358" y2="105" stroke="#333" marker-end="url(#a)"/>
  <line x1="430" y1="145" x2="430" y2="183" stroke="#333" marker-end="url(#a)"/>
  <text x="438" y="168" font-size="11" fill="#5b6778">read frame</text>
  <line x1="125" y1="275" x2="298" y2="250" stroke="#333" marker-end="url(#a)"/>
  <line x1="560" y1="215" x2="588" y2="140" stroke="#333" marker-end="url(#a)"/>
  <text x="545" y="160" font-size="11" fill="#5b6778">write</text>
  <path d="M645,155 L645,203" stroke="#333" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="652" y="177" font-size="11" fill="#5b6778">swap on</text>
  <text x="652" y="191" font-size="11" fill="#5b6778">v-sync</text>
  <line x1="560" y1="275" x2="588" y2="300" stroke="#333" marker-end="url(#a)"/>
  <line x1="700" y1="232" x2="753" y2="185" stroke="#333" marker-end="url(#a)"/>
  <line x1="330" y1="330" x2="365" y2="297" stroke="#333" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="352" y="330" font-size="11" fill="#5b6778">Space: save / V: view</text>
</svg>
